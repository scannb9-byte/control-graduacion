<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Control de Invitaciones</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- BARRA DE ESTADO: total / presentes -->
  <header class="barra">
    <div class="cifra"><b id="total">–</b><span class="sep">/</span><b id="presentes" class="verde">–</b></div>
    <div class="leyenda">total / presentes <span id="sync" class="punto" title="Sincronización"></span></div>
  </header>

  <!-- CÁMARA -->
  <div class="camara">
    <div id="lector"></div>
    <button id="btnCamara" class="btn-cam oculto">📷 Activar cámara</button>
  </div>

  <!-- MODO -->
  <div class="modos">
    <button id="btnIn" class="modo activo in">⬇ INGRESO</button>
    <button id="btnOut" class="modo out">⬆ SALIDA</button>
  </div>

  <!-- RESULTADO -->
  <div id="overlay" class="overlay oculto">
    <div class="icono" id="ovIcono"></div>
    <div class="titulo" id="ovTitulo"></div>
    <div class="codigo" id="ovCodigo"></div>
  </div>

  <!-- AVISO (conflictos detectados por el servidor) -->
  <div id="aviso" class="aviso oculto"></div>

  <!-- LOGIN -->
  <div id="login" class="login oculto">
    <form id="formLogin" class="tarjeta">
      <h2>🎓 Encargado</h2>
      <input id="inputPin" type="password" inputmode="numeric" placeholder="PIN" required>
      <button class="btn" type="submit">Entrar</button>
      <p id="loginError" class="error"></p>
    </form>
  </div>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
